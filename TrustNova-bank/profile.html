<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile | TrustNova Bank</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header class="dashboard-header">

    <div class="dashboard-logo">

        <img src="images/logo.png" alt="TrustNova Bank">

        <h2>TrustNova Bank</h2>

    </div>


    <div class="dashboard-user">

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="index.html">
            Logout
        </a>

    </div>

</header>




<section class="profile-page">


    <div class="profile-box">


        <img src="images/logo.png"
             alt="Profile"
             class="profile-logo">


        <h1>
            Customer Profile
        </h1>


        <p>
            Manage your personal banking information.
        </p>




        <div class="profile-info">


            <div>
                <strong>Full Name</strong>
                <span>John Customer</span>
            </div>


            <div>
                <strong>Email</strong>
                <span>customer@example.com</span>
            </div>


            <div>
                <strong>Phone</strong>
                <span>+1 800 123 4567</span>
            </div>


            <div>
                <strong>Account Number</strong>
                <span>**** **** 4589</span>
            </div>


            <div>
                <strong>Account Type</strong>
                <span>Premium Checking</span>
            </div>


        </div>



        <button>
            Update Profile
        </button>



        <a href="dashboard.html" class="back-home">

            ← Back to Dashboard

        </a>


    </div>


</section>




<script src="script.js"></script>


</body>

</html>
