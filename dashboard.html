<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard - TrustNova Bank</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="header">

<img src="images/logo.png" class="login-logo">

<h1>TrustNova Bank</h1>

<a href="login.html">Logout</a>

</header>



<section class="dashboard">


<h2>
Welcome, <span id="customerName">Customer</span>
</h2>



<div class="card-container">


<div class="card">

<h3>Account Number</h3>

<p id="accountNumber">
Loading...
</p>

</div>



<div class="card">

<h3>Account Type</h3>

<p id="accountType">
Checking
</p>

</div>



<div class="card">

<h3>Available Balance</h3>

<p>
$<span id="balance">0.00</span>
</p>

</div>


</div>




<div class="actions">


<a href="transfer.html">
Transfer Money
</a>


<a href="transactions.html">
Transactions
</a>


<a href="profile.html">
Profile
</a>


</div>




<div class="card">


<h2>
Recent Transactions
</h2>


<table>


<thead>

<tr>

<th>Description</th>

<th>Amount</th>

<th>Status</th>

</tr>

</thead>


<tbody id="transactionList">


<tr>

<td colspan="3">
No transactions yet
</td>

</tr>


</tbody>


</table>


</div>


</section>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="dashboard.js"></script>


</body>

</html>
