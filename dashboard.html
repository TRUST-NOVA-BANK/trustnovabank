<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
TrustNova Bank Dashboard
</title>


<link rel="stylesheet" href="style.css">


</head>



<body>



<header class="dashboard-header">


<div class="dashboard-logo">


<img src="images/logo.png" alt="TrustNova Bank">


<h2>
TrustNova Bank
</h2>


</div>





<div class="dashboard-user">


<a href="dashboard.html">
Dashboard
</a>


<a href="profile.html">
Profile
</a>


<a href="transfer.html">
Transfer
</a>


<a href="#" onclick="logout()">
Logout
</a>


</div>


</header>









<section class="dashboard">






<!-- Customer Profile -->

<div class="profile-card">


<img

id="user_photo"

src="images/default-user.png"

alt="Profile Photo"

>


<h2 id="user_name">

Loading...

</h2>



<p id="user_email">

</p>



<p id="user_status">

</p>


</div>









<!-- Account Balance -->


<div class="balance-card">


<p>
Available Balance
</p>


<h1 id="balance">

$0.00

</h1>



<p>
Account Number:
<span id="account_number">

Loading...

</span>

</p>



<p>
Account Type:
<span id="account_type">

Loading...

</span>

</p>



</div>









<!-- Quick Actions -->


<div class="quick-actions">


<h2>
Quick Actions
</h2>



<div class="action-grid">


<a href="transfer.html">

💸

<br>

Transfer Money

</a>





<a href="transactions.html">

📄

<br>

Transactions

</a>






<a href="profile.html">

👤

<br>

Profile

</a>





<a href="#">

🏦

<br>

Accounts

</a>



</div>


</div>









<!-- Recent Transactions -->


<div class="recent">



<h2>
Recent Transactions
</h2>





<table>


<thead>


<tr>


<th>
Description
</th>


<th>
Amount
</th>


<th>
Status
</th>


</tr>


</thead>




<tbody id="transactionList">


<tr>


<td colspan="3">

Loading transactions...

</td>


</tr>


</tbody>



</table>



</div>







</section>









<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="auth-check.js"></script>

<script src="dashboard.js"></script>



</body>

</html>
