<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard - TrustNova Bank</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="header">

<img src="images/logo.png" class="login-logo">

<h1>TrustNova Bank</h1>

<a href="login.html">Logout</a>

</header>



<section class="dashboard">

    <!-- Add profile card here -->
    <div class="profile-card">

        <img id="user_photo" src="images/default-user.png">

        <h2 id="user_name">
            Loading...
        </h2>

        <p id="user_email"></p>

        <p id="user_nationality"></p>

        <p id="user_status"></p>

    </div>


    <!-- Your existing dashboard content -->
    <div class="balance-card">
        ...
    </div>

</section>


<div class="actions">


<a href="transfer.html">
Transfer Money
</a>


<a href="transactions.html">
Transactions
</a>


<a href="profile.html">
Profile
</a>


</div>




<div class="card">


<h2>
Recent Transactions
</h2>


<table>


<thead>

<tr>

<th>Description</th>

<th>Amount</th>

<th>Status</th>

</tr>

</thead>


<tbody id="transactionList">


<tr>

<td colspan="3">
No transactions yet
</td>

</tr>


</tbody>


</table>


</div>


</section>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="dashboard.js"></script>


</body>

</html>
