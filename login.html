<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - TrustNova Bank</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<section class="login-page">

    <div class="login-box">

        <img src="images/logo.png" class="login-logo" alt="TrustNova Bank Logo">

        <h1>Welcome Back</h1>

        <p>Login to your TrustNova Bank account</p>

        <form id="loginForm">

            <div class="input-group">

                <label>Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required>

            </div>

            <div class="input-group">

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required>

            </div>

            <div class="remember">

                <label>

                    <input type="checkbox">

                    Remember me

                </label>

                <a href="forgot-password.html">

                    Forgot Password?

                </a>

            </div>

            <button type="submit">

                Login

            </button>

        </form>

        <div class="register-link">

            Don't have an account?

            <a href="register.html">

                Create Account

            </a>

        </div>

    </div>

</section>

<!-- Supabase Library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Supabase Configuration -->
<script src="supabase.js"></script>

<!-- Login Script -->
<script src="login.js"></script>

</body>

</html>
