 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Open Bank Account - TrustNova Bank</title>

    <link rel="stylesheet"
          href="style.css">
</head>

<body>

    <header>
        <h1>TrustNova Bank</h1>
    </header>


    <main>

        <section class="account-opening">

            <h2>Open a Bank Account</h2>

            <p>
                Choose the type of account you would like to open.
            </p>


            <form id="openAccountForm">

                <label for="account_type">
                    Account Type
                </label>

                <select id="account_type"
                        name="account_type"
                        required>

                    <option value="">
                        Select account type
                    </option>

                    <option value="Checking">
                        Checking Account
                    </option>

                    <option value="Savings">
                        Savings Account
                    </option>

                </select>


                <button type="submit">
                    Open Account
                </button>

            </form>

        </section>

    </main>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Your Supabase configuration -->
    <script src="supabase.js"></script>

    <!-- Account-opening logic -->
    <script src="open-account.js"></script>

</body>

</html>
