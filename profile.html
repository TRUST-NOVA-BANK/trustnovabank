<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile | TrustNova Bank</title>

<link rel="stylesheet" href="profile.css">

</head>


<body>


<header class="bank-header">


<div class="bank-logo">

<img src="images/logo.png" alt="TrustNova Bank">

<h2>
TrustNova Bank
</h2>

</div>



<div class="header-links">

<a href="dashboard.html">
Dashboard
</a>


<a href="#" onclick="logout()">
Logout
</a>


</div>


</header>







<section class="profile-page">



<div class="profile-card">


<img 
id="profile_photo"
src="images/default-user.png"
class="profile-image"
>



<h1 id="full_name">

Loading...

</h1>


<p id="email">

</p>




<div class="profile-details">



<div>

<strong>
Phone
</strong>

<span id="phone">
Loading...
</span>

</div>




<div>

<strong>
Account Number
</strong>

<span id="account_number">
Loading...
</span>

</div>





<div>

<strong>
Account Type
</strong>

<span id="account_type">
Loading...
</span>

</div>





<div>

<strong>
Account Status
</strong>

<span id="account_status">
Loading...
</span>

</div>




</div>






<a href="dashboard.html"
class="back-btn">

← Back To Dashboard

</a>



</div>



</section>







<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="profile.js"></script>


</body>

</html>
