<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Profile | TrustNova Bank
</title>


<link rel="stylesheet" href="style.css">


</head>



<body>



<header class="dashboard-header">


<div class="dashboard-logo">


<img src="images/logo.png" alt="TrustNova Bank">


<h2>
TrustNova Bank
</h2>


</div>





<div class="dashboard-user">


<a href="dashboard.html">
Dashboard
</a>


<a href="#" onclick="logout()">
Logout
</a>


</div>


</header>









<section class="profile-page">



<div class="profile-box">





<img

id="profile_photo"

src="images/default-user.png"

class="profile-logo"

alt="Profile Photo"

>







<h1>
Customer Profile
</h1>



<p>
Manage your TrustNova Bank information.
</p>







<div class="profile-info">





<div>

<label>
First Name
</label>


<input

id="first_name"

type="text"

>

</div>






<div>

<label>
Last Name
</label>


<input

id="last_name"

type="text"

>

</div>







<div>

<label>
Email
</label>


<input

id="email"

type="email"

readonly

>

</div>







<div>

<label>
Phone
</label>


<input

id="phone"

type="text"

>

</div>







</div>







<button

id="updateProfile"

>

Update Profile

</button>








<a

href="dashboard.html"

class="back-home"

>

← Back to Dashboard

</a>






</div>



</section>









<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="auth-check.js"></script>

<script src="profile.js"></script>



</body>

</html>
