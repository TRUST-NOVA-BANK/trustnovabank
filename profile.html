<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile | TrustNova Bank</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="dashboard-header">

    <div class="dashboard-logo">

        <img src="images/logo.png" alt="TrustNova Bank">

        <h2>TrustNova Bank</h2>

    </div>

    <div class="dashboard-user">

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="#" onclick="logout()">
            Logout
        </a>

    </div>

</header>

<section class="profile-page">

    <div class="profile-box">

        <img
            id="profilePhoto"
            src="images/default-user.png"
            alt="Profile"
            class="profile-logo">

        <h1>Customer Profile</h1>

        <p>Manage your personal banking information.</p>

        <div class="profile-info">

            <div>

                <strong>Full Name</strong>

                <span id="fullName"></span>

            </div>

            <div>

                <strong>Email</strong>

                <span id="email"></span>

            </div>

            <div>

                <strong>Phone</strong>

                <span id="phone"></span>

            </div>

            <div>

                <strong>Nationality</strong>

                <span id="nationality"></span>

            </div>

            <div>

                <strong>Sex</strong>

                <span id="sex"></span>

            </div>

            <div>

                <strong>Date of Birth</strong>

                <span id="dob"></span>

            </div>

            <div>

                <strong>Account Number</strong>

                <span id="accountNumber"></span>

            </div>

            <div>

                <strong>Account Type</strong>

                <span id="accountType"></span>

            </div>

            <div>

                <strong>Status</strong>

                <span id="status"></span>

            </div>

        </div>

        <button>

            Update Profile

        </button>

        <a href="dashboard.html" class="back-home">

            ← Back to Dashboard

        </a>

    </div>

</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="profile.js"></script>

</body>

</html>
