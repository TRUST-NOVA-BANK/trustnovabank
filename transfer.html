<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Transfer Money | TrustNova Bank
</title>


<link rel="stylesheet" href="style.css">


</head>



<body>



<header class="dashboard-header">


<div class="dashboard-logo">


<img src="images/logo.png" alt="TrustNova Bank">


<h2>
TrustNova Bank
</h2>


</div>





<div class="dashboard-user">


<a href="dashboard.html">
Dashboard
</a>


<a href="#" onclick="logout()">
Logout
</a>


</div>


</header>








<section class="transfer-page">



<div class="transfer-box">



<img

src="images/logo.png"

class="profile-logo"

alt="TrustNova Bank"

>



<h1>
Transfer Money
</h1>



<p>
Send USD securely to another TrustNova Bank account.
</p>







<form id="transferForm">





<label>
Recipient Account Number
</label>



<input

type="text"

id="recipient"

placeholder="Enter account number"

required

>







<label>
Amount (USD)
</label>



<input

type="number"

id="amount"

placeholder="0.00"

min="1"

step="0.01"

required

>








<label>
Description
</label>



<textarea

id="description"

placeholder="Payment description"

rows="4"

></textarea>








<button type="submit">

Send Money

</button>






</form>







<div class="secure-message">


🔒 Your transfer is protected by TrustNova Bank security.


</div>





</div>



</section>









<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="auth-check.js"></script>

<script src="transfer.js"></script>



</body>

</html>
